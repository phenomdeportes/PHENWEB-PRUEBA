<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phenom | Tienda Oficial</title>
    <!-- Importación de Fuentes Tipográficas -->
    <link href="https://fonts.googleapis.com/css2?family=Arial&family=Courier+New&family=Georgia&family=Impact&family=Lucida+Console&family=Palatino&family=Segoe+UI&family=Tahoma&family=Times+New+Roman&family=Verdana&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Roboto:wght@400;700;900&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* --- CORRECCIÓN IMAGEN PRODUCTO (SIN BORDES NEGROS) --- */
        .product-card .card-img-wrapper {
            background: #ffffff; height: 220px; border-radius: 6px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; margin-bottom: 15px; position: relative;
            cursor: pointer;
        }
        .product-card .card-img-wrapper img, .product-card .card-img-wrapper video {
            max-width: 90%; max-height: 90%; object-fit: contain; background: transparent; pointer-events: none;
        }
        /* Precio en negro y botón sin negrita */
        .offer-price { color: #000 !important; font-size: 16px; font-weight: 900; }
        .regular-price { text-decoration: line-through; color: #999; font-size: 12px; margin-right: 8px; }
        .btn-add-cart {
            background: #000; color: #fff; text-align: center; padding: 10px;
            border-radius: 6px; font-size: 12px; font-weight: 400 !important; text-transform: uppercase; border: none;
            cursor: pointer; width: 100%; margin-bottom: 8px;
        }
        .btn-add-cart:hover { background: #222; }
    </style>
    <!-- SDK de Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAKkxCG40b98933qH3LVSoLoXnXzX588lE",
        authDomain: "phenom-store.firebaseapp.com",
        projectId: "phenom-store",
        storageBucket: "phenom-store.firebasestorage.app",
        messagingSenderId: "85501083109",
        appId: "1:85501083109:web:b600ee8d110eeac6a0830c",
        measurementId: "G-DXBGJSSVNC"
      };

      const app = initializeApp(firebaseConfig);
      window.db = getFirestore(app);
      window.firebaseDocRef = doc(window.db, "tienda", "configuracion_global");
      window.setDoc = setDoc;
      window.getDoc = getDoc;
    </script>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar-container" id="top-bar-wrapper">
        <div class="top-bar" id="fub-bar">¡BIENVENIDOS A LA TIENDA OFICIAL DE PHENOM!</div>
    </div>

    <!-- HEADER / MENÚ DE NAVEGACIÓN -->
    <header class="header" id="main-header">
        <div class="logo-container" onclick="handleLogoClick()">
            <img src="logo.png" alt="Logo Phenom" id="logo-trigger">
            <span id="logo-adj-text-val"></span>
        </div>

        <nav class="nav-links" id="main-nav-links">
            <a onclick="navigateToCategory('PROTECTORES')">PROTECTORES</a>
            <a onclick="navigateToCategory('ACCESORIOS')">ACCESORIOS</a>
            <a onclick="navigateToCategory('INDUMENTARIA')">INDUMENTARIA</a>
            <a onclick="navigateToCategory('RECUPERACIÓN')">RECUPERACIÓN</a>
            <a class="highlight" onclick="navigateToCategory('Todos')">CATÁLOGO COMPLETO</a>
        </nav>

        <div class="header-controls">
            <input type="text" class="search-box" placeholder="Buscar..." oninput="filterCatalogSearch(this.value)">
            <div class="cart-icon-wrapper" onclick="toggleCartDrawer(true)" title="Ver Carrito de Compras">
                <span class="icon">🛒</span>
                <span id="cart-badge-count" class="cart-badge" style="display:none;">0</span>
            </div>
            <div class="hamburger" onclick="toggleMobileMenu()">☰</div>
        </div>
    </header>

    <!-- VISTA CATÁLOGO -->
    <div id="view-catalog" class="page-view active-view" style="min-height: 80vh; padding: 40px 20px;">
        <div class="catalog-container" id="catalog-main-bg" style="max-width: 1200px; margin: 0 auto;">
            <div class="catalog-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <div>
                    <h1 class="catalog-title" id="catalog-category-title">CATÁLOGO OFICIAL</h1>
                </div>
                <button class="btn-add-product-top" id="btn-dynamic-add-prod" onclick="openCreateProductModal()" style="display:none; background:#28a745; color:white; padding:10px; border-radius:6px; border:none; cursor:pointer;">+ Agregar Producto</button>
            </div>
            <div class="catalog-grid" id="catalog-grid-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;"></div>
        </div>
    </div>

    <!-- PANEL LATERAL DEL CARRITO -->
    <div id="cart-drawer-overlay" onclick="toggleCartDrawer(false)" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:10000;"></div>
    <div id="cart-drawer" style="position:fixed; top:0; right:-400px; width:380px; height:100vh; background:#fff; z-index:10001; transition:0.3s; display:flex; flex-direction:column; box-shadow:-5px 0 15px rgba(0,0,0,0.2);">
        <div class="cart-header" style="padding:20px; background:#111; color:#fff; display:flex; justify-content:space-between; align-items:center;">
            <span>🛒 Tu Carrito</span>
            <button onclick="toggleCartDrawer(false)" style="background:none; border:none; color:#fff; font-size:20px; cursor:pointer;">✕</button>
        </div>
        <div class="cart-body" id="cart-drawer-body" style="flex:1; padding:20px; overflow-y:auto;"></div>
        <div class="cart-footer" id="cart-drawer-footer" style="padding:20px; border-top:1px solid #eee; background:#f9f9f9;"></div>
    </div>

    <!-- MODAL SELECCIONAR VARIANTE -->
    <div id="variant-modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:15000; align-items:center; justify-content:center;">
        <div style="background:#fff; padding:25px; border-radius:8px; width:90%; max-width:400px; text-align:center; position:relative;">
            <button onclick="closeVariantModal()" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:20px; cursor:pointer;">✕</button>
            <h3 style="margin-bottom:10px;">Seleccionar Variante</h3>
            <p id="variant-modal-prod-title" style="font-size:14px; color:#333; font-weight:bold; margin-bottom:15px;"></p>
            <div id="variant-modal-options" style="display:flex; flex-wrap:wrap; justify-content:center; gap:10px;"></div>
        </div>
    </div>

    <!-- MODAL PANEL OMEGA -->
    <div id="dark-product-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:20000; align-items:center; justify-content:center;">
        <div style="background:#222; color:#fff; padding:30px; border-radius:10px; width:90%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative; border: 1px solid #d4af37;">
            <button onclick="closeDarkModal()" style="position:absolute; top:15px; right:20px; background:none; border:none; font-size:24px; color:#fff; cursor:pointer;">✕</button>
            <h2 style="color:#d4af37; margin-bottom:20px;">Control Omega: Publicación</h2>
            <input type="hidden" id="dark-prod-id">
            
            <label style="display:block; margin-bottom:5px; font-size:12px;">Título Exacto del Producto</label>
            <input type="text" id="dark-title" style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; border:none;" placeholder="Ej: Guante PHENOM Negro">
            
            <label style="display:block; margin-bottom:5px; font-size:12px;">Categoría</label>
            <select id="dark-category" style="width:100%; padding:10px; margin-bottom:15px; border-radius:4px; border:none;">
                <option value="PROTECTORES">PROTECTORES</option>
                <option value="ACCESORIOS">ACCESORIOS</option>
                <option value="INDUMENTARIA">INDUMENTARIA</option>
                <option value="RECUPERACIÓN">RECUPERACIÓN</option>
            </select>

            <label style="display:block; margin-bottom:5px; font-size:12px;">Talles / Onzas (Opcional)</label>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px; background:#111; padding:10px; border-radius:6px;">
                <label><input type="checkbox" value="10oz" class="chk-oz"> 10oz</label>
                <label><input type="checkbox" value="12oz" class="chk-oz"> 12oz</label>
                <label><input type="checkbox" value="14oz" class="chk-oz"> 14oz</label>
                <label><input type="checkbox" value="16oz" class="chk-oz"> 16oz</label>
                <label><input type="checkbox" value="S" class="chk-oz"> S</label>
                <label><input type="checkbox" value="M" class="chk-oz"> M</label>
                <label><input type="checkbox" value="L" class="chk-oz"> L</label>
            </div>

            <div style="display:flex; gap:15px; margin-bottom:15px;">
                <div style="flex:1;">
                    <label style="display:block; margin-bottom:5px; font-size:12px;">Precio Tachado</label>
                    <input type="text" id="dark-reg-price" style="width:100%; padding:10px; border-radius:4px; border:none;" placeholder="Ej: $2.500">
                </div>
                <div style="flex:1;">
                    <label style="display:block; margin-bottom:5px; font-size:12px; color:#d4af37; font-weight:bold;">Precio en Oferta</label>
                    <input type="text" id="dark-price" style="width:100%; padding:10px; border-radius:4px; border:none;" placeholder="Ej: $2.090 UYU">
                </div>
            </div>

            <label style="display:block; margin-bottom:5px; font-size:12px;">Cargar Imagen Local (Opcional)</label>
            <input type="file" accept="image/*" onchange="handleDarkFiles(this)" style="margin-bottom:20px; color:#fff;">

            <button onclick="saveDarkProduct()" style="width:100%; padding:15px; background:#d4af37; color:#000; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">PUBLICAR EN TIENDA</button>
        </div>
    </div>

    <!-- LÓGICA UNIFICADA Y BLINDADA -->
    <script>
        // Módulo Omega - Core App & E-Commerce Logic
        // SIN PRODUCTOS PREDETERMINADOS. EL ARRAY ESTÁ VACÍO Y LISTO PARA LA CARGA REAL.
        let productsData = []; 
        let cart = [];
        let isEditMode = false;
        let clickCount = 0;
        let clickTimer;
        let pendingVariantProductObj = null;
        let currentUploadedFiles = [];
        let selectedShippingMethod = 'retiro'; 

        // INICIALIZACIÓN
        window.onload = () => {
            loadLocalData();
            renderCatalogGrid('Todos');
            updateCartBadge();
        };

        function handleLogoClick() {
            clickCount++;
            clearTimeout(clickTimer);
            clickTimer = setTimeout(() => { clickCount = 0; }, 1500);
            if (clickCount === 5) {
                isEditMode = !isEditMode;
                document.getElementById('btn-dynamic-add-prod').style.display = isEditMode ? 'block' : 'none';
                renderCatalogGrid('Todos');
                clickCount = 0;
            }
        }

        // --- NAVEGACIÓN Y FILTROS ---
        function navigateToCategory(cat) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('highlight'));
            event.target.classList.add('highlight');
            renderCatalogGrid(cat);
        }

        function filterCatalogSearch(query) {
            const q = query.toLowerCase();
            const filtered = productsData.filter(p => p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            renderCatalog(filtered);
        }

        // --- SISTEMA DE PERSISTENCIA ---
        function loadLocalData() {
            const local = localStorage.getItem('phenom_tienda_omega');
            if(local) {
                const data = JSON.parse(local);
                productsData = data.productsData || [];
                cart = data.cart || [];
            }
        }

        function saveData() {
            localStorage.setItem('phenom_tienda_omega', JSON.stringify({ productsData, cart }));
        }

        // --- PANEL OMEGA: CARGA DE PRODUCTOS ---
        function openCreateProductModal() {
            document.getElementById('dark-prod-id').value = '';
            document.getElementById('dark-title').value = '';
            document.getElementById('dark-reg-price').value = '';
            document.getElementById('dark-price').value = '';
            document.querySelectorAll('.chk-oz').forEach(c => c.checked = false);
            currentUploadedFiles = [];
            
            const modal = document.getElementById('dark-product-modal');
            modal.style.display = 'flex';
        }

        function closeDarkModal() {
            document.getElementById('dark-product-modal').style.display = 'none';
        }

        function handleDarkFiles(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => { currentUploadedFiles = [e.target.result]; };
                reader.readAsDataURL(file);
            }
        }

        function saveDarkProduct() {
            const idInput = document.getElementById('dark-prod-id').value;
            const title = document.getElementById('dark-title').value;
            const regPrice = document.getElementById('dark-reg-price').value;
            const offerPrice = document.getElementById('dark-price').value;
            const category = document.getElementById('dark-category').value;
            
            if (!title || !offerPrice) {
                alert("Operación denegada: El título y el precio en oferta son obligatorios.");
                return;
            }

            const selectedOz = [];
            document.querySelectorAll('.chk-oz:checked').forEach(c => selectedOz.push(c.value));

            // GENERACIÓN DE IDENTIDAD ÚNICA INMUTABLE
            const newId = idInput || 'prod-' + Date.now();
            
            const newProduct = {
                id: newId,
                title: title,
                category: category,
                variants: selectedOz,
                regularPrice: regPrice,
                price: offerPrice,
                media: currentUploadedFiles
            };

            if (idInput) {
                const idx = productsData.findIndex(p => p.id === idInput);
                if(idx !== -1) productsData[idx] = newProduct;
            } else {
                productsData.push(newProduct);
            }

            saveData();
            closeDarkModal();
            renderCatalogGrid('Todos');
        }

        // --- RENDERIZADO DEL CATÁLOGO DINÁMICO ---
        function renderCatalogGrid(category) {
            let filtered = productsData;
            if (category && category !== 'Todos') {
                filtered = productsData.filter(p => p.category === category);
            }
            renderCatalog(filtered);
        }

        function renderCatalog(productsArray) {
            const container = document.getElementById('catalog-grid-container');
            container.innerHTML = '';

            productsArray.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                
                let imgHtml = (p.media && p.media.length > 0) ? `<img src="${p.media[0]}">` : `<div style="color:#ccc;">SIN IMAGEN</div>`;
                let variantsHtml = (p.variants && p.variants.length > 0) ? p.variants.map(v => `<span style="background:#f1f5f9; padding:2px 6px; font-size:10px; border-radius:4px; margin-right:4px;">${v}</span>`).join('') : '';

                card.innerHTML = `
                    <div class="card-img-wrapper">${imgHtml}</div>
                    <div style="font-weight:700; font-size:15px; margin-bottom:5px;">${p.title}</div>
                    <div style="margin-bottom:10px;">${variantsHtml}</div>
                    <div style="margin-bottom:15px;">
                        ${p.regularPrice ? `<span class="regular-price">${p.regularPrice}</span>` : ''}
                        <span class="offer-price">${p.price}</span>
                    </div>
                    <button class="btn-add-cart" onclick="handleAddToCartClick('${p.id}')">AGREGAR AL CARRITO</button>
                    <div style="display:${isEditMode ? 'flex' : 'none'}; gap:10px; margin-top:10px;">
                        <button onclick="editProduct('${p.id}')" style="flex:1; padding:8px; background:#007bff; color:#fff; border:none; border-radius:4px; cursor:pointer;">Editar</button>
                        <button onclick="deleteProduct('${p.id}')" style="flex:1; padding:8px; background:#dc3545; color:#fff; border:none; border-radius:4px; cursor:pointer;">Borrar</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function deleteProduct(id) {
            if(confirm('¿Eliminar producto de forma definitiva?')) {
                productsData = productsData.filter(p => p.id !== id);
                saveData();
                renderCatalogGrid('Todos');
            }
        }

        // --- SISTEMA DE CARRITO BLINDADO ---
        function handleAddToCartClick(productId) {
            // BÚSQUEDA ESTRICTA EN BASE DE DATOS. CERO LECTURAS GENÉRICAS DEL DOM.
            const product = productsData.find(p => p.id === productId);
            if (!product) return;

            if (product.variants && product.variants.length > 0) {
                openVariantModal(product);
            } else {
                addToCartDirect(product, 'Única');
            }
        }

        function openVariantModal(product) {
            pendingVariantProductObj = product;
            const modal = document.getElementById('variant-modal-overlay');
            const container = document.getElementById('variant-modal-options');
            document.getElementById('variant-modal-prod-title').innerText = product.title;
            
            container.innerHTML = '';
            product.variants.forEach(variant => {
                const btn = document.createElement('button');
                btn.innerText = variant;
                btn.style.cssText = "padding:10px 20px; border:1px solid #000; background:#fff; font-weight:bold; cursor:pointer; border-radius:4px;";
                btn.onclick = () => {
                    closeVariantModal();
                    addToCartDirect(pendingVariantProductObj, variant);
                };
                container.appendChild(btn);
            });

            modal.style.display = 'flex';
        }

        function closeVariantModal() {
            document.getElementById('variant-modal-overlay').style.display = 'none';
            pendingVariantProductObj = null;
        }

        function addToCartDirect(product, variant) {
            const priceNum = parseInt(product.price.toString().replace(/[^0-9]/g, '')) || 0;
            const existingIndex = cart.findIndex(item => item.id === product.id && item.variant === variant);
            
            if (existingIndex !== -1) {
                cart[existingIndex].quantity += 1;
            } else {
                cart.push({
                    id: product.id,
                    title: product.title, // TITULO EXACTO GARANTIZADO
                    variant: variant,     // TALLE EXACTO GARANTIZADO
                    priceStr: product.price, // PRECIO OFERTA EXACTO GARANTIZADO
                    priceNum: priceNum,
                    image: (product.media && product.media.length > 0) ? product.media[0] : '',
                    quantity: 1
                });
            }

            saveData();
            updateCartBadge();
            renderCartDrawer();
            toggleCartDrawer(true);
        }

        function toggleCartDrawer(forceOpen) {
            const drawer = document.getElementById('cart-drawer');
            const overlay = document.getElementById('cart-drawer-overlay');
            if (forceOpen) {
                drawer.style.right = '0';
                overlay.style.display = 'block';
            } else {
                drawer.style.right = '-400px';
                overlay.style.display = 'none';
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge-count');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            badge.innerText = totalCount;
            badge.style.display = totalCount > 0 ? 'flex' : 'none';
        }

        function renderCartDrawer() {
            const body = document.getElementById('cart-drawer-body');
            const footer = document.getElementById('cart-drawer-footer');
            
            if (cart.length === 0) {
                body.innerHTML = `<p style="text-align:center; color:#666; margin-top:40px;">Tu carrito está vacío</p>`;
                footer.style.display = 'none';
                return;
            }

            footer.style.display = 'block';
            let html = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.priceNum * item.quantity;
                subtotal += itemTotal;
                html += `
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                        <img src="${item.image}" style="width:50px; height:50px; object-fit:contain; background:#f8f9fa;">
                        <div style="flex:1; font-size:13px;">
                            <strong>${item.title}</strong><br>
                            Opción: <strong>${item.variant}</strong><br>
                            <span style="color:#000; font-weight:bold;">$${itemTotal.toLocaleString('es-UY')} UYU</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:5px;">
                            <button onclick="changeQty(${index}, -1)" style="border:1px solid #ccc; background:#fff; padding:2px 6px; cursor:pointer;">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${index}, 1)" style="border:1px solid #ccc; background:#fff; padding:2px 6px; cursor:pointer;">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#dc3545; cursor:pointer; margin-left:10px;">✕</button>
                    </div>
                `;
            });

            const shippingCost = selectedShippingMethod === 'domicilio' ? 180 : 0;
            const finalTotal = subtotal + shippingCost;

            body.innerHTML = html + `
                <div style="margin-top:20px;">
                    <h4 style="font-size:13px; margin-bottom:10px;">🚚 Método de Envío</h4>
                    <label style="display:block; margin-bottom:5px; font-size:13px;"><input type="radio" name="shipping" onchange="setShipping('retiro')" ${selectedShippingMethod==='retiro'?'checked':''}> Retiro (GRATIS)</label>
                    <label style="display:block; font-size:13px;"><input type="radio" name="shipping" onchange="setShipping('domicilio')" ${selectedShippingMethod==='domicilio'?'checked':''}> Envío a Domicilio ($180 UYU)</label>
                </div>
            `;

            footer.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold; font-size:16px;">
                    <span>TOTAL:</span>
                    <span>$${finalTotal.toLocaleString('es-UY')} UYU</span>
                </div>
                <button onclick="checkoutWhatsApp()" style="width:100%; background:#25D366; color:#fff; border:none; padding:15px; border-radius:6px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;">
                    Finalizar Compra vía WhatsApp ✆
                </button>
            `;
        }

        function changeQty(index, delta) {
            cart[index].quantity += delta;
            if(cart[index].quantity <= 0) cart.splice(index, 1);
            saveData(); updateCartBadge(); renderCartDrawer();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveData(); updateCartBadge(); renderCartDrawer();
        }

        function setShipping(method) {
            selectedShippingMethod = method;
            renderCartDrawer();
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;
            let subtotal = 0;
            let itemsText = '';

            cart.forEach(item => {
                subtotal += (item.priceNum * item.quantity);
                itemsText += `• *${item.title}* (${item.variant}) x${item.quantity} - ${item.priceStr}\n`;
            });

            const shipCost = selectedShippingMethod === 'domicilio' ? 180 : 0;
            const shipText = selectedShippingMethod === 'domicilio' ? 'Envío a Domicilio ($180)' : 'Retiro en Tienda (Gratis)';
            const finalTotal = subtotal + shipCost;

            let msg = `¡Hola PHENOM! 👋 Quisiera realizar este pedido:\n\n📦 *DETALLE:*\n${itemsText}\n🚚 *ENVÍO:* ${shipText}\n\n💰 *TOTAL:* $${finalTotal.toLocaleString('es-UY')} UYU\n\nQuedo a la espera.`;
            window.open(`https://wa.me/59893418239?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>
